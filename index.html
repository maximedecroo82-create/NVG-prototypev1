<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NVG-OS // Système de Vision Nocturne & ESP (Mobile Turbo)</title>
    <!-- Tailwind CSS pour la mise en page réactive -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Police monospace tactique -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        /* Configuration globale et styles tactiques personnalisés */
        :root {
            --hud-color: #00ff66;
            --hud-glow: rgba(0, 255, 102, 0.45);
            --hud-bg: rgba(0, 20, 8, 0.72);
        }

        body.mode-wp {
            --hud-color: #38f2ff;
            --hud-glow: rgba(56, 242, 255, 0.45);
            --hud-bg: rgba(4, 18, 28, 0.72);
        }

        body.mode-normal {
            --hud-color: #ffaa00;
            --hud-glow: rgba(255, 170, 0, 0.45);
            --hud-bg: rgba(20, 14, 4, 0.72);
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030504;
            font-family: 'Share Tech Mono', monospace;
            color: var(--hud-color);
        }

        /* Effets visuels NVG légers (accélération GPU sans surcoût) */
        .scanlines {
            background: linear-gradient(
                to bottom,
                rgba(255, 255, 255, 0),
                rgba(255, 255, 255, 0) 50%,
                rgba(0, 0, 0, 0.25) 50%,
                rgba(0, 0, 0, 0.25)
            );
            background-size: 100% 4px;
            pointer-events: none;
        }

        .vignette {
            background: radial-gradient(
                circle at center,
                transparent 55%,
                rgba(0, 0, 0, 0.55) 84%,
                rgba(0, 0, 0, 0.94) 100%
            );
            pointer-events: none;
        }

        /* Bordures et boutons tactiques (sans backdrop-filter lourd pour le GPU mobile) */
        .hud-panel {
            background: var(--hud-bg);
            border: 1px solid var(--hud-color);
            box-shadow: 0 0 8px var(--hud-glow);
        }

        .hud-btn {
            background: rgba(0, 0, 0, 0.65);
            border: 1px solid var(--hud-color);
            color: var(--hud-color);
            transition: transform 0.1s ease, background-color 0.1s ease;
        }

        .hud-btn:active {
            transform: scale(0.95);
        }

        .hud-btn.active {
            background: var(--hud-color);
            color: #020804;
            font-weight: bold;
            box-shadow: 0 0 10px var(--hud-glow);
        }

        /* Curseur personnalisé pour le gain lumineux */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.15);
            height: 6px;
            border-radius: 999px;
            border: 1px solid var(--hud-color);
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--hud-color);
            cursor: pointer;
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .blink {
            animation: pulseGlow 1.4s infinite;
        }
    </style>
</head>
<body class="mode-green">

    <!-- Conteneur principal plein écran -->
    <div id="app-container" class="relative w-full h-full overflow-hidden bg-black">

        <!-- Flux vidéo de la caméra (résolution optimisée mobile) -->
        <video id="webcam" class="absolute inset-0 w-full h-full object-cover" autoplay playsinline muted></video>

        <!-- Canvas secondaire pour le mode démo si aucune caméra n'est disponible -->
        <canvas id="demo-bg-canvas" class="hidden absolute inset-0 w-full h-full object-cover"></canvas>

        <!-- Canvas principal pour l'affichage ESP & Squelette -->
        <canvas id="esp-canvas" class="absolute inset-0 w-full h-full pointer-events-none z-10"></canvas>

        <!-- Couches d'effets optiques NVG -->
        <div id="scanlines-layer" class="scanlines absolute inset-0 z-20"></div>
        <div id="vignette-layer" class="vignette absolute inset-0 z-20"></div>

        <!-- Réticule central discret -->
        <div class="absolute inset-0 flex items-center justify-center pointer-events-none z-20 opacity-45">
            <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
                <circle cx="32" cy="32" r="14" stroke="currentColor" stroke-width="1" stroke-dasharray="4 4"/>
                <line x1="32" y1="6" x2="32" y2="14" stroke="currentColor" stroke-width="1.5"/>
                <line x1="32" y1="50" x2="32" y2="58" stroke="currentColor" stroke-width="1.5"/>
                <line x1="6" y1="32" x2="14" y2="32" stroke="currentColor" stroke-width="1.5"/>
                <line x1="50" y1="32" x2="58" y2="32" stroke="currentColor" stroke-width="1.5"/>
                <circle cx="32" cy="32" r="1.5" fill="currentColor"/>
            </svg>
        </div>

        <!-- HUD SUPÉRIEUR : Télémétrie & État du système -->
        <header class="absolute top-0 left-0 right-0 z-30 p-3 sm:p-4 flex justify-between items-start pointer-events-none">
            <!-- Bloc gauche : Statut IA & FPS -->
            <div class="hud-panel rounded-lg px-3 py-2 text-xs sm:text-sm pointer-events-auto">
                <div class="flex items-center gap-2 font-bold tracking-wider">
                    <span id="status-dot" class="inline-block w-2.5 h-2.5 rounded-full bg-current blink"></span>
                    <span id="system-status">INIT IA...</span>
                </div>
                <div class="mt-1 opacity-90 flex flex-wrap gap-x-3 gap-y-0.5 text-[11px] sm:text-xs">
                    <span>FPS: <strong id="fps-counter">0</strong></span>
                    <span>CIBLES: <strong id="target-counter">0</strong></span>
                    <span id="res-badge">RES: AUTO</span>
                </div>
            </div>

            <!-- Bloc droit : Bascule caméra & Mode Perf -->
            <div class="flex flex-col sm:flex-row gap-2 pointer-events-auto">
                <button id="btn-perf-mode" class="hud-btn active rounded-lg px-3 py-2 text-xs sm:text-sm shadow-lg" title="Mode Éco/Turbo Mobile">
                    TURBO: ON
                </button>
                <button id="btn-switch-cam" class="hud-btn rounded-lg px-3 py-2 text-xs sm:text-sm flex items-center gap-1.5 shadow-lg" title="Changer de caméra">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                    </svg>
                    <span id="source-badge">ARR</span>
                </button>
            </div>
        </header>

        <!-- ÉCRAN DE DÉMARRAGE / GESTION D'ERREUR CAMÉRA -->
        <div id="overlay-modal" class="absolute inset-0 z-40 flex items-center justify-center p-4 bg-black/90">
            <div class="hud-panel rounded-xl max-w-md w-full p-6 text-center space-y-4">
                <div class="inline-block px-3 py-1 rounded border border-current text-xs tracking-widest uppercase">
                    NVG-OS // TURBO MOBILE v2.5
                </div>
                <h1 class="text-xl sm:text-2xl font-bold tracking-wider">SYSTÈME DE VISION NOCTURNE & ESP</h1>
                <p id="modal-message" class="text-xs sm:text-sm opacity-90 leading-relaxed">
                    Initialisation du capteur basse latence (480p) et du réseau neuronal léger. Traitement 100 % local sur votre appareil.
                </p>

                <!-- Barre de progression de chargement IA -->
                <div id="loader-container" class="w-full space-y-1.5">
                    <div class="w-full h-2 rounded-full bg-black/60 border border-current overflow-hidden">
                        <div id="loader-bar" class="h-full bg-current transition-all duration-300" style="width: 15%"></div>
                    </div>
                    <p id="loader-text" class="text-[11px] opacity-80">Chargement du moteur IA léger...</p>
                </div>

                <!-- Boutons d'action -->
                <div id="modal-actions" class="hidden pt-2 flex flex-col sm:flex-row gap-3 justify-center">
                    <button id="btn-start-cam" class="hud-btn active rounded-lg px-4 py-3 text-sm tracking-wider cursor-pointer">
                        ACTIVER LA CAMÉRA
                    </button>
                    <button id="btn-start-demo" class="hud-btn rounded-lg px-4 py-3 text-sm tracking-wider cursor-pointer">
                        MODE SIMULATION (DÉMO)
                    </button>
                </div>
            </div>
        </div>

        <!-- HUD INFÉRIEUR : Contrôles tactiques -->
        <footer class="absolute bottom-0 left-0 right-0 z-30 p-3 sm:p-4 flex flex-col gap-2.5 pointer-events-none">

            <!-- Barre de réglage du Gain / Amplification lumineuse -->
            <div class="hud-panel rounded-lg px-3 py-2 max-w-md w-full mx-auto pointer-events-auto flex items-center gap-3">
                <span class="text-xs whitespace-nowrap">GAIN LUM.</span>
                <input id="gain-slider" type="range" min="80" max="260" value="145" class="w-full">
                <span id="gain-value" class="text-xs w-10 text-right">145%</span>
            </div>

            <!-- Rangée des boutons de modes NVG et filtres ESP -->
            <div class="flex flex-wrap justify-center gap-2 pointer-events-auto">
                <!-- Modes Optiques -->
                <button id="btn-mode-green" class="hud-btn active rounded-lg px-3 py-2 text-xs sm:text-sm">
                    NVG VERT
                </button>
                <button id="btn-mode-wp" class="hud-btn rounded-lg px-3 py-2 text-xs sm:text-sm">
                    PHOSPHORE BLANC
                </button>
                <button id="btn-mode-normal" class="hud-btn rounded-lg px-3 py-2 text-xs sm:text-sm">
                    OPT. NORMALE
                </button>

                <!-- Bascules ESP -->
                <button id="btn-toggle-skeleton" class="hud-btn active rounded-lg px-3 py-2 text-xs sm:text-sm">
                    SQUELETTE: ON
                </button>
                <button id="btn-toggle-box" class="hud-btn active rounded-lg px-3 py-2 text-xs sm:text-sm">
                    BOÎTE ESP: ON
                </button>
            </div>
        </footer>
    </div>

    <!-- Script principal : MediaPipe Tasks Vision + Caméra basse latence + Rendu ESP optimisé -->
    <script type="module">
        import {
            PoseLandmarker,
            FilesetResolver
        } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

        // ==========================================
        // 1. ÉTAT GLOBAL DE L'APPLICATION
        // ==========================================
        const state = {
            poseLandmarker: null,
            isModelReady: false,
            isRunning: false,
            isDemoMode: false,
            isTurboMobile: true,       // Active la résolution légère + saut de frame IA + canvas sans shadowBlur
            facingMode: "environment", // "environment" = caméra arrière, "user" = avant
            nvgMode: "green",          // "green" | "wp" | "normal"
            gain: 145,
            showSkeleton: true,
            showBox: true,
            lastVideoTime: -1,
            aiTick: 0,
            lastDetectedPoses: [],
            frameCount: 0,
            lastFpsUpdate: performance.now(),
            currentFps: 0
        };

        // Références DOM
        const video = document.getElementById("webcam");
        const demoBgCanvas = document.getElementById("demo-bg-canvas");
        const demoBgCtx = demoBgCanvas.getContext("2d", { alpha: false });
        const espCanvas = document.getElementById("esp-canvas");
        const ctx = espCanvas.getContext("2d");

        const overlayModal = document.getElementById("overlay-modal");
        const modalMessage = document.getElementById("modal-message");
        const loaderContainer = document.getElementById("loader-container");
        const loaderBar = document.getElementById("loader-bar");
        const loaderText = document.getElementById("loader-text");
        const modalActions = document.getElementById("modal-actions");

        const systemStatus = document.getElementById("system-status");
        const fpsCounter = document.getElementById("fps-counter");
        const targetCounter = document.getElementById("target-counter");
        const resBadge = document.getElementById("res-badge");
        const sourceBadge = document.getElementById("source-badge");
        const gainSlider = document.getElementById("gain-slider");
        const gainValue = document.getElementById("gain-value");

        // Connexions anatomiques clés (indices MediaPipe Pose)
        const SKELETON_CONNECTIONS = [
            [11, 12], [11, 23], [12, 24], [23, 24],
            [11, 13], [13, 15],
            [12, 14], [14, 16],
            [23, 25], [25, 27], [27, 31],
            [24, 26], [26, 28], [28, 32],
            [0, 11], [0, 12]
        ];

        const KEY_JOINTS = [0, 11, 12, 13, 14, 15, 16, 23, 24, 25, 26, 27, 28];

        // ==========================================
        // 2. INITIALISATION DE MEDIAPIPE POSE LITE (LE PLUS LÉGER)
        // ==========================================
        async function initPoseLandmarker() {
            try {
                loaderBar.style.width = "35%";
                loaderText.textContent = "Chargement runtime WASM...";

                const vision = await FilesetResolver.forVisionTasks(
                    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
                );

                loaderBar.style.width = "70%";
                loaderText.textContent = "Chargement Pose Lite Float16 (Ultra-léger)...";

                // Modèle Lite Float16 + 1 cible principale en mode Turbo pour maximiser les FPS mobile
                state.poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
                    baseOptions: {
                        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
                        delegate: "GPU"
                    },
                    runningMode: "VIDEO",
                    numPoses: 2,
                    minPoseDetectionConfidence: 0.45,
                    minPosePresenceConfidence: 0.45,
                    minTrackingConfidence: 0.45
                });

                loaderBar.style.width = "100%";
                loaderText.textContent = "Moteur IA léger prêt.";
                state.isModelReady = true;

                await startCamera();
            } catch (error) {
                console.error("Erreur lors du chargement de MediaPipe :", error);
                showFallbackModal(
                    "Impossible de charger le moteur IA WebGL/WASM sur cet appareil. Vérifiez votre connexion initiale ou lancez le mode simulation.",
                    true
                );
            }
        }

        // ==========================================
        // 3. GESTION DE LA CAMÉRA (BASSE RÉSOLUTION MOBILE)
        // ==========================================
        async function startCamera() {
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }

            state.isDemoMode = false;
            state.lastDetectedPoses = [];
            video.classList.remove("hidden");
            demoBgCanvas.classList.add("hidden");

            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                showFallbackModal(
                    "Votre navigateur ne supporte pas l'accès à la caméra (HTTPS requis sur mobile). Vous pouvez tester l'interface via le mode simulation.",
                    true
                );
                return;
            }

            try {
                // Résolution calibrée mobile (480x360 en mode Turbo, 640x480 sinon)
                // Évite que le téléphone ne capture en 1080p/4K et sature le GPU/CPU
                const targetWidth = state.isTurboMobile ? 480 : 640;
                const targetHeight = state.isTurboMobile ? 360 : 480;

                const constraints = {
                    audio: false,
                    video: {
                        facingMode: { ideal: state.facingMode },
                        width: { ideal: targetWidth, max: 640 },
                        height: { ideal: targetHeight, max: 480 },
                        frameRate: { ideal: 30, max: 30 }
                    }
                };

                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;

                await new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        video.play();
                        resolve();
                    };
                });

                overlayModal.classList.add("hidden");
                systemStatus.textContent = "NVG ACTIF // SCAN";
                sourceBadge.textContent = state.facingMode === "environment" ? "ARR" : "AVT";
                resBadge.textContent = `${video.videoWidth}x${video.videoHeight}`;
                applyVideoFilters();
                resizeCanvases();

                if (!state.isRunning) {
                    state.isRunning = true;
                    requestAnimationFrame(renderLoop);
                }
            } catch (err) {
                console.warn("Accès caméra refusé ou indisponible :", err);
                let msg = "Accès à la caméra refusé ou aucune caméra détectée sur cet appareil.";
                if (err.name === "NotAllowedError") {
                    msg = "Permission caméra refusée. Autorisez l'accès dans les réglages du navigateur ou testez le mode simulation.";
                }
                showFallbackModal(msg, true);
            }
        }

        function startDemoMode() {
            state.isDemoMode = true;
            video.classList.add("hidden");
            demoBgCanvas.classList.remove("hidden");
            overlayModal.classList.add("hidden");

            systemStatus.textContent = "MODE SIMULATION";
            sourceBadge.textContent = "SIMU";
            resBadge.textContent = "SIMU-360P";
            applyVideoFilters();
            resizeCanvases();

            if (!state.isRunning) {
                state.isRunning = true;
                requestAnimationFrame(renderLoop);
            }
        }

        function showFallbackModal(message, showButtons) {
            overlayModal.classList.remove("hidden");
            loaderContainer.classList.add("hidden");
            modalMessage.textContent = message;
            if (showButtons) {
                modalActions.classList.remove("hidden");
            }
        }

        // ==========================================
        // 4. FILTRES OPTIQUES DE VISION NOCTURNE
        // ==========================================
        function applyVideoFilters() {
            const b = state.gain / 100;
            const c = 1 + (state.gain - 100) / 180;

            let filterCSS = "";
            if (state.nvgMode === "green") {
                filterCSS = `grayscale(100%) brightness(${b}) contrast(${c}) sepia(100%) hue-rotate(75deg) saturate(420%)`;
            } else if (state.nvgMode === "wp") {
                filterCSS = `grayscale(100%) brightness(${b}) contrast(${c * 1.08}) sepia(100%) hue-rotate(155deg) saturate(260%)`;
            } else {
                filterCSS = `brightness(${b}) contrast(${c})`;
            }

            const mirrorTransform = (!state.isDemoMode && state.facingMode === "user") ? "scaleX(-1)" : "scaleX(1)";

            video.style.filter = filterCSS;
            video.style.transform = mirrorTransform;
            demoBgCanvas.style.filter = filterCSS;
        }

        // ==========================================
        // 5. REDIMENSIONNEMENT ADAPTATIF DU CANVAS
        // ==========================================
        function resizeCanvases() {
            // Ratio d'échelle limité à 1 (pas de suréchantillonnage Retina 3x sur le canvas ESP)
            // Gain énorme de FPS sur les écrans haute densité (AMOLED/Retina)
            const w = window.innerWidth;
            const h = window.innerHeight;
            espCanvas.width = w;
            espCanvas.height = h;
            demoBgCanvas.width = Math.floor(w * 0.5);
            demoBgCanvas.height = Math.floor(h * 0.5);
        }
        window.addEventListener("resize", resizeCanvases);

        // ==========================================
        // 6. RENDU DU FOND EN MODE SIMULATION (DÉMO)
        // ==========================================
        function drawDemoEnvironment(now) {
            const w = demoBgCanvas.width;
            const h = demoBgCanvas.height;

            demoBgCtx.fillStyle = "#080c0a";
            demoBgCtx.fillRect(0, 0, w, h);

            demoBgCtx.strokeStyle = "rgba(180, 220, 200, 0.14)";
            demoBgCtx.lineWidth = 1;

            const horizonY = h * 0.48;
            const centerX = w * 0.5;

            for (let i = -4; i <= 4; i++) {
                demoBgCtx.beginPath();
                demoBgCtx.moveTo(centerX + i * 15, horizonY);
                demoBgCtx.lineTo(centerX + i * (w * 0.35), h);
                demoBgCtx.stroke();
            }

            demoBgCtx.strokeRect(w * 0.15, h * 0.2, w * 0.7, h * 0.58);
            demoBgCtx.strokeRect(w * 0.32, h * 0.32, w * 0.36, h * 0.34);

            const t = now * 0.0025;
            const swayX = Math.sin(t * 0.7) * 0.14;
            const bobY = Math.abs(Math.sin(t * 2)) * 0.015;
            const armSwing = Math.sin(t * 2) * 0.04;
            const legSwing = Math.cos(t * 2) * 0.035;

            const cx = 0.5 + swayX;
            const cy = 0.52 + bobY;

            const fakeLandmarks = Array.from({ length: 33 }, () => ({ x: cx, y: cy, visibility: 0.98 }));
            fakeLandmarks[0]  = { x: cx, y: cy - 0.24, visibility: 0.99 };
            fakeLandmarks[11] = { x: cx - 0.07, y: cy - 0.14, visibility: 0.98 };
            fakeLandmarks[12] = { x: cx + 0.07, y: cy - 0.14, visibility: 0.98 };
            fakeLandmarks[13] = { x: cx - 0.10, y: cy - 0.03 + armSwing, visibility: 0.95 };
            fakeLandmarks[14] = { x: cx + 0.10, y: cy - 0.03 - armSwing, visibility: 0.95 };
            fakeLandmarks[15] = { x: cx - 0.11, y: cy + 0.08 + armSwing * 1.5, visibility: 0.92 };
            fakeLandmarks[16] = { x: cx + 0.11, y: cy + 0.08 - armSwing * 1.5, visibility: 0.92 };
            fakeLandmarks[23] = { x: cx - 0.045, y: cy + 0.05, visibility: 0.97 };
            fakeLandmarks[24] = { x: cx + 0.045, y: cy + 0.05, visibility: 0.97 };
            fakeLandmarks[25] = { x: cx - 0.05, y: cy + 0.19 + legSwing, visibility: 0.94 };
            fakeLandmarks[26] = { x: cx + 0.05, y: cy + 0.19 - legSwing, visibility: 0.94 };
            fakeLandmarks[27] = { x: cx - 0.055, y: cy + 0.33, visibility: 0.91 };
            fakeLandmarks[28] = { x: cx + 0.055, y: cy + 0.33, visibility: 0.91 };

            return [fakeLandmarks];
        }

        // ==========================================
        // 7. CONVERSION DES COORDONNÉES (OBJECT-COVER)
        // ==========================================
        function mapLandmarkToScreen(lm, canvasW, canvasH, sourceW, sourceH, isMirrored) {
            let nx = isMirrored ? (1 - lm.x) : lm.x;
            let ny = lm.y;

            if (!sourceW || !sourceH) {
                return { x: nx * canvasW, y: ny * canvasH };
            }

            const videoRatio = sourceW / sourceH;
            const screenRatio = canvasW / canvasH;

            let drawW = canvasW;
            let drawH = canvasH;
            let offsetX = 0;
            let offsetY = 0;

            if (screenRatio > videoRatio) {
                drawH = canvasW / videoRatio;
                offsetY = (canvasH - drawH) / 2;
            } else {
                drawW = canvasH * videoRatio;
                offsetX = (canvasW - drawW) / 2;
            }

            return {
                x: nx * drawW + offsetX,
                y: ny * drawH + offsetY
            };
        }

        // ==========================================
        // 8. DESSIN DU SQUELETTE & DE LA BOÎTE ESP (OPTIMISÉ)
        // ==========================================
        function getHudPalette() {
            if (state.nvgMode === "wp") {
                return { primary: "#38f2ff", secondary: "#ffffff", boxBg: "rgba(56, 242, 255, 0.08)" };
            }
            if (state.nvgMode === "normal") {
                return { primary: "#ffaa00", secondary: "#ff3b30", boxBg: "rgba(255, 170, 0, 0.08)" };
            }
            return { primary: "#00ff66", secondary: "#b8ffda", boxBg: "rgba(0, 255, 102, 0.08)" };
        }

        function drawEspTargets(poses, sourceW, sourceH) {
            const w = espCanvas.width;
            const h = espCanvas.height;
            ctx.clearRect(0, 0, w, h);

            targetCounter.textContent = poses.length;
            if (poses.length === 0) return;

            const palette = getHudPalette();
            const isMirrored = !state.isDemoMode && state.facingMode === "user";

            // Désactive shadowBlur en mode Turbo (énorme gain GPU sur mobile)
            ctx.shadowBlur = state.isTurboMobile ? 0 : 8;
            ctx.shadowColor = palette.primary;

            poses.forEach((landmarks, index) => {
                let minX = Infinity, minY = Infinity;
                let maxX = -Infinity, maxY = -Infinity;
                let visibilitySum = 0;
                let visibleCount = 0;

                const screenPoints = landmarks.map((lm, idx) => {
                    const pt = mapLandmarkToScreen(lm, w, h, sourceW, sourceH, isMirrored);
                    if (KEY_JOINTS.includes(idx) && (lm.visibility ?? 1) > 0.35) {
                        if (pt.x < minX) minX = pt.x;
                        if (pt.y < minY) minY = pt.y;
                        if (pt.x > maxX) maxX = pt.x;
                        if (pt.y > maxY) maxY = pt.y;
                        visibilitySum += (lm.visibility ?? 0.85);
                        visibleCount++;
                    }
                    return { x: pt.x, y: pt.y, visibility: lm.visibility ?? 1 };
                });

                if (visibleCount < 4) return;

                const boxWidthRaw = Math.max(40, maxX - minX);
                const boxHeightRaw = Math.max(80, maxY - minY);
                const padX = boxWidthRaw * 0.18;
                const padYTop = boxHeightRaw * 0.14;
                const padYBottom = boxHeightRaw * 0.08;

                const bx = Math.max(8, minX - padX);
                const by = Math.max(28, minY - padYTop);
                const bw = Math.min(w - bx - 8, boxWidthRaw + padX * 2);
                const bh = Math.min(h - by - 8, boxHeightRaw + padYTop + padYBottom);

                const heightRatio = bh / h;
                const estimatedMeters = Math.max(0.8, Math.min(25, (1.45 / Math.max(0.08, heightRatio)))).toFixed(1);
                const confidencePct = Math.min(99, Math.round((visibilitySum / visibleCount) * 100));

                // --- A. DESSIN DU SQUELETTE (UN SEUL PATH POUR TOUS LES OS) ---
                if (state.showSkeleton) {
                    ctx.strokeStyle = palette.primary;
                    ctx.lineWidth = 2.5;
                    ctx.lineCap = "round";
                    ctx.beginPath();

                    for (let k = 0; k < SKELETON_CONNECTIONS.length; k++) {
                        const [i, j] = SKELETON_CONNECTIONS[k];
                        const p1 = screenPoints[i];
                        const p2 = screenPoints[j];
                        if (p1 && p2 && p1.visibility > 0.35 && p2.visibility > 0.35) {
                            ctx.moveTo(p1.x, p1.y);
                            ctx.lineTo(p2.x, p2.y);
                        }
                    }
                    ctx.stroke();

                    // Articulations regroupées dans un seul path
                    ctx.fillStyle = palette.secondary;
                    ctx.beginPath();
                    for (let k = 0; k < KEY_JOINTS.length; k++) {
                        const idx = KEY_JOINTS[k];
                        const pt = screenPoints[idx];
                        if (pt && pt.visibility > 0.35) {
                            const r = idx === 0 ? 4.5 : 3;
                            ctx.moveTo(pt.x + r, pt.y);
                            ctx.arc(pt.x, pt.y, r, 0, Math.PI * 2);
                        }
                    }
                    ctx.fill();
                }

                // --- B. DESSIN DE LA BOÎTE ESP TACTIQUE ---
                if (state.showBox) {
                    ctx.fillStyle = palette.boxBg;
                    ctx.fillRect(bx, by, bw, bh);

                    ctx.strokeStyle = palette.primary;
                    ctx.lineWidth = 1;
                    ctx.setLineDash([4, 4]);
                    ctx.strokeRect(bx, by, bw, bh);
                    ctx.setLineDash([]);

                    const cornerLen = Math.min(20, bw * 0.22, bh * 0.15);
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.moveTo(bx, by + cornerLen);
                    ctx.lineTo(bx, by);
                    ctx.lineTo(bx + cornerLen, by);
                    ctx.moveTo(bx + bw - cornerLen, by);
                    ctx.lineTo(bx + bw, by);
                    ctx.lineTo(bx + bw, by + cornerLen);
                    ctx.moveTo(bx, by + bh - cornerLen);
                    ctx.lineTo(bx, by + bh);
                    ctx.lineTo(bx + cornerLen, by + bh);
                    ctx.moveTo(bx + bw - cornerLen, by + bh);
                    ctx.lineTo(bx + bw, by + bh);
                    ctx.lineTo(bx + bw, by + bh - cornerLen);
                    ctx.stroke();

                    // Étiquette HUD
                    const labelText = `TARGET #${index + 1} // ~${estimatedMeters}m [${confidencePct}%]`;
                    ctx.font = "bold 11px 'Share Tech Mono', monospace";
                    const textMetrics = ctx.measureText(labelText);
                    const tagW = textMetrics.width + 10;
                    const tagH = 18;
                    const tagY = Math.max(4, by - tagH - 2);

                    ctx.fillStyle = palette.primary;
                    ctx.fillRect(bx, tagY, tagW, tagH);

                    ctx.fillStyle = "#020804";
                    ctx.fillText(labelText, bx + 5, tagY + 13);
                }
            });
        }

        // ==========================================
        // 9. BOUCLE PRINCIPALE TEMPS RÉEL (DÉCOUPLÉE)
        // ==========================================
        function renderLoop(now) {
            if (!state.isRunning) return;

            // Calcul des FPS
            state.frameCount++;
            if (now - state.lastFpsUpdate >= 500) {
                state.currentFps = Math.round((state.frameCount * 1000) / (now - state.lastFpsUpdate));
                fpsCounter.textContent = state.currentFps;
                state.frameCount = 0;
                state.lastFpsUpdate = now;
            }

            if (state.isDemoMode) {
                const poses = drawDemoEnvironment(now);
                drawEspTargets(poses, demoBgCanvas.width, demoBgCanvas.height);
            } else if (video.readyState >= 2 && state.isModelReady && state.poseLandmarker) {
                if (video.currentTime !== state.lastVideoTime) {
                    state.lastVideoTime = video.currentTime;
                    state.aiTick++;

                    // En mode Turbo Mobile : exécute l'IA 1 frame sur 2 (double les FPS d'affichage)
                    const runAiThisFrame = !state.isTurboMobile || (state.aiTick % 2 === 0);

                    if (runAiThisFrame) {
                        const results = state.poseLandmarker.detectForVideo(video, now);
                        state.lastDetectedPoses = results?.landmarks || [];
                    }

                    drawEspTargets(state.lastDetectedPoses, video.videoWidth, video.videoHeight);
                }
            }

            requestAnimationFrame(renderLoop);
        }

        // ==========================================
        // 10. ÉVÉNEMENTS DE L'INTERFACE UTILISATEUR
        // ==========================================
        document.getElementById("btn-start-cam").addEventListener("click", () => startCamera());
        document.getElementById("btn-start-demo").addEventListener("click", () => startDemoMode());

        document.getElementById("btn-switch-cam").addEventListener("click", () => {
            state.facingMode = state.facingMode === "environment" ? "user" : "environment";
            startCamera();
        });

        // Bouton Turbo Mobile (bascule 480x360 + AI 1/2 frame vs 640x480 + AI chaque frame)
        const btnPerfMode = document.getElementById("btn-perf-mode");
        btnPerfMode.addEventListener("click", () => {
            state.isTurboMobile = !state.isTurboMobile;
            btnPerfMode.classList.toggle("active", state.isTurboMobile);
            btnPerfMode.textContent = `TURBO: ${state.isTurboMobile ? "ON" : "OFF"}`;
            if (!state.isDemoMode) {
                startCamera();
            }
        });

        gainSlider.addEventListener("input", (e) => {
            state.gain = parseInt(e.target.value, 10);
            gainValue.textContent = `${state.gain}%`;
            applyVideoFilters();
        });

        const btnGreen = document.getElementById("btn-mode-green");
        const btnWp = document.getElementById("btn-mode-wp");
        const btnNormal = document.getElementById("btn-mode-normal");

        function setNvgMode(mode) {
            state.nvgMode = mode;
            document.body.className = `mode-${mode}`;
            btnGreen.classList.toggle("active", mode === "green");
            btnWp.classList.toggle("active", mode === "wp");
            btnNormal.classList.toggle("active", mode === "normal");
            applyVideoFilters();
        }

        btnGreen.addEventListener("click", () => setNvgMode("green"));
        btnWp.addEventListener("click", () => setNvgMode("wp"));
        btnNormal.addEventListener("click", () => setNvgMode("normal"));

        const btnSkeleton = document.getElementById("btn-toggle-skeleton");
        btnSkeleton.addEventListener("click", () => {
            state.showSkeleton = !state.showSkeleton;
            btnSkeleton.classList.toggle("active", state.showSkeleton);
            btnSkeleton.textContent = `SQUELETTE: ${state.showSkeleton ? "ON" : "OFF"}`;
        });

        const btnBox = document.getElementById("btn-toggle-box");
        btnBox.addEventListener("click", () => {
            state.showBox = !state.showBox;
            btnBox.classList.toggle("active", state.showBox);
            btnBox.textContent = `BOÎTE ESP: ${state.showBox ? "ON" : "OFF"}`;
        });

        // Lancement au chargement de la page
        resizeCanvases();
        initPoseLandmarker();
    </script>
</body>
</html>
